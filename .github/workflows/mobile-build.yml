name: Heritage Survey Mobile Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heritage-mobile-build
  cancel-in-progress: true

jobs:
  detect-source:
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.check.outputs.has_source }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [[ -f index.html && -f manifest.json && -f sw.js && -f icon-192.png && -f icon-512.png ]]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "Source app files are not all present yet; build jobs will be skipped."
          fi

  android-apk:
    needs: detect-source
    if: ${{ needs.detect-source.outputs.has_source == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare offline web app
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.heritage.survey",
            "appName": "Heritage Land Survey",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Heritage-Survey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

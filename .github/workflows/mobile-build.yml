name: Heritage Survey Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a running build/deploy when a new commit arrives.
concurrency:
  group: heritage-survey-release
  cancel-in-progress: false

jobs:
  detect-source:
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.check.outputs.has_source }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify app files
        id: check
        shell: bash
        run: |
          missing=0
          for file in index.html manifest.json sw.js icon-192.png icon-512.png; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              missing=1
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  android-apk:
    needs: detect-source
    if: ${{ needs.detect-source.outputs.has_source == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare offline web app
        shell: bash
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.heritage.survey",
            "appName": "Heritage Land Survey",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Heritage-Survey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  deploy-pwa:
    needs: detect-source
    if: ${{ needs.detect-source.outputs.has_source == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p site
          cp index.html manifest.json sw.js icon-192.png icon-512.png site/
          # Preserve the app's own offline paths while publishing under /Survey-/
          test -s site/index.html
          test -s site/manifest.json
          test -s site/sw.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
